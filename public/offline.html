<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#172033">
    <title>Offline | TallyERP</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #f5f7fb; color: #1f2937; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        .box { text-align: center; padding: 2rem; max-width: 360px; }
        img { width: 72px; height: 72px; border-radius: 16px; }
        h1 { font-size: 1.25rem; margin: 1rem 0 .5rem; }
        p { color: #6b7280; margin: 0 0 1.5rem; }
        button { background: #4f46e5; color: #fff; border: 0; border-radius: 8px; padding: .6rem 1.4rem; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="box">
        <img src="/icons/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>TallyERP needs an internet connection to open your books. Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
